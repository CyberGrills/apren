services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: seven_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seven_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 7077
      APP_ORIGIN: http://127.0.0.1:7077
    ports:
      - "7077:7077"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: