name: Production smoke monitoring

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main, fix/production-smoke-monitoring]
    paths:
      - 'scripts/production-smoke.mjs'
      - '.github/workflows/production-smoke.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify production API
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check production endpoints
        id: smoke
        continue-on-error: true
        run: node scripts/production-smoke.mjs
        env:
          SEVEN_PRODUCTION_URL: https://apren.vercel.app

      - name: Open or update incident issue on failure
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Production] 7even smoke check failed';
            const body = [
              'The scheduled production smoke check failed.',
              '',
              '- Workflow: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              '- Commit: ' + context.sha,
              '- Time: ' + new Date().toISOString(),
              '',
              'Inspect the workflow output for endpoint names and sanitized failure reasons. Do not paste secrets into the issue.',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              if (Date.now() - new Date(existing.updated_at).getTime() > 60 * 60 * 1000) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
              }
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: created.number,
                  labels: ['production-smoke'],
                });
              } catch (error) {
                core.warning('Incident issue created; optional label could not be added: ' + error.message);
              }
            }

      - name: Close incident issue after recovery
        if: steps.smoke.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Production] 7even smoke check failed';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Production smoke checks have recovered at ' + new Date().toISOString() + '. Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }

      - name: Fail workflow if production is unhealthy
        if: steps.smoke.outcome == 'failure'
        run: exit 1
