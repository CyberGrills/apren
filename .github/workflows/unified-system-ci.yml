name: 7even hotel booking engine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: seven-hotel-booking-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: seven_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d seven_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Diagnose and validate npm lockfile configuration
        run: |
          node -e "const fs=require('node:fs'); const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8')); if(lock.lockfileVersion!==3) throw new Error('Expected lockfile version 3'); console.log('Root lockfile present; version', lock.lockfileVersion, 'workspaces:', lock.packages[''].workspaces.join(', ')); console.log('npm package-lock config:', process.env.npm_config_package_lock ?? '(default)');"
          npm config get package-lock
      - run: npm ci --package-lock=true
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Run isolated PostgreSQL integration suite
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/seven_test_db
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/seven_test_db
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/seven_test_db
          PAYMENT_MODE: mock
          APP_ORIGIN: http://127.0.0.1:5177
