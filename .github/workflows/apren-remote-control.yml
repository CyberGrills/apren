name: apren Remote Control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Controlled operation to run"
        required: true
        type: choice
        options:
          - audit
          - build
          - audit-and-build

permissions:
  contents: read

concurrency:
  group: apren-remote-control
  cancel-in-progress: true

jobs:
  control:
    name: Remote ${${ inputs.operation }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        if: ${${ inputs.operation == 'build' || inputs.operation == 'audit-and-build' }}
        run: npm install --no-audit --no-fund
      - name: Repository audit
        if: ${${ inputs.operation == 'audit' || inputs.operation == 'audit-and-build' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "=== apren remote audit ==="
          echo "Commit: $(git rev-parse HEAD)"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo
          echo "Workspace packages:"
          node -e 'const p=require("./package.json"); console.log(p.workspaces.join("\n"))'
          echo
          echo "Git status:"
          git status --short
          echo
          echo "Tracked workflow files:"
          find .github/workflows -maxdepth 1 -type f -print | sort
      - name: Web build
        if: ${${ inputs.operation == 'build' || inputs.operation == 'audit-and-build' }}
        run: npm run build:web
