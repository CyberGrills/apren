<!doctype html>
<html lang="en-NG"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="theme-color" content="#F7F5EF" />
<script>
  (() => {
    try {
      const preference = localStorage.getItem("7even-color-mode");
      const dark = preference === "dark" || (preference === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.mode = dark ? "dark" : "light";
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
    } catch {
      document.documentElement.dataset.mode = "light";
    }
  })();
</script><meta name="description" content="Find rooms, dining and experiences in Nigeria. Reserve with 7even and earn points on completed visits." /><link rel="icon" href="/brand/icon.svg?v=2" type="image/svg+xml" /><link rel="apple-touch-icon" href="/brand/icon-180.png" /><link rel="manifest" href="/manifest.webmanifest" /><title>7even | Good places. Worth your time.</title></head><body><a class="skip-link" href="#main-content">Skip to content</a><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
